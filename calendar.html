<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar — medlifeofmushi</title>
<meta name="description" content="Health awareness days, webinars, events, contests and skill workshops for medical students.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#17120f;--surf:#241b16;--line:#3a2c23;--ink:#f1e6d3;--mut:#b9a98f;--acc:#d48a95;--accbg:#3b2429;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f6efe4;--surf:#fffaf1;--line:#e0d2bd;--ink:#2b1d15;--mut:#6f5d4b;--acc:#9a4a57;--accbg:#f3dfe0;color-scheme:light}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0}
.brand{font:600 1.15rem/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.18em;color:var(--ink);text-decoration:none}
.back{color:var(--mut);text-decoration:none;font-size:.95rem;padding:8px 0}
.back:hover,.back:focus-visible{color:var(--acc)}
h1{font:600 clamp(2.2rem,8vw,3.4rem)/1.05 "Cormorant Garamond",Georgia,serif;margin:8px 0 6px}
.lead{color:var(--mut);max-width:60ch;margin:0 0 22px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.bar h2{font:600 1.5rem/1 "Cormorant Garamond",Georgia,serif;margin:0 auto 0 4px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:40px}
.btn:hover{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;min-height:36px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{opacity:.5}
.chip[aria-pressed=false] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.seg .chip[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);opacity:1}
.seg .chip[aria-pressed=false]{opacity:.75}
.lab{color:var(--mut);font-size:.9rem;align-self:center;margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:16px 0 28px}
.wd{text-align:center;color:var(--mut);font-size:.8rem;padding-bottom:4px}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-height:56px;padding:6px 2px;background:var(--surf);border:1px solid var(--line);border-radius:10px}
.cd.o{opacity:.45}
.cd.t{border-color:var(--acc);border-width:2px}
.cd[aria-pressed=true]{background:var(--accbg);border-color:var(--acc)}
.cd .n{font-weight:500}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.day h2{font:600 1.7rem/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
.ev{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ev h3{font:600 1.35rem/1.25 "Cormorant Garamond",Georgia,serif;margin:6px 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--mut);font-size:.88rem}
.ev p{margin:4px 0 0;color:var(--mut);max-width:62ch}
.go{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:999px;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:500}
.go:hover{opacity:.9}
.mut{color:var(--mut)}
footer{border-top:1px solid var(--line);margin-top:32px;padding-top:16px;color:var(--mut);font-size:.88rem;max-width:62ch}
@media (min-width:640px){.cd{min-height:84px;padding:8px 6px}.dots i{width:8px;height:8px}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <a class="brand" href="index.html">MEDLIFEOFMUSHI</a>
 <a class="back" href="index.html">Back to home</a>
</header>
<main>
 <h1>Calendar</h1>
 <p class="lead">Health awareness days, plus webinars, events, contests and skill workshops added by the site owner.</p>
 <div class="bar">
  <h2 id="title" aria-live="polite"></h2>
  <button class="btn" id="prev" aria-label="Previous month">‹</button>
  <button class="btn" id="today">Today</button>
  <button class="btn" id="next" aria-label="Next month">›</button>
 </div>
 <div class="chips" id="cats" role="group" aria-label="Show categories"></div>
 <div class="chips seg" id="lvs" role="group" aria-label="Awareness day level"></div>
 <div class="grid" id="grid"></div>
 <section class="day" id="day" aria-live="polite"></section>
</main>
<footer>Awareness-day dates follow the usual annual calendar. Confirm dates and details on the organiser’s official page before registering or sharing.</footer>
</div>
<script>
const CATS=[["medday","Health awareness days","#3f9a86"],["webinar","Webinars","#5b82ad"],["event","Events","#b5465a"],["contest","Contests","#d09a35"],["workshop","Skill workshops","#8f9a7f"]];
const CC=Object.fromEntries(CATS.map(c=>[c[0],c]));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pd=s=>{const[a,b,c]=s.split("-");return new Date(+a,b-1,+c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const long=d=>d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});

/* Your events come from events.json (same folder as this page) */
let OWN=[];
fetch("events.json?v="+Date.now()).then(r=>r.ok?r.json():{events:[]}).then(j=>{
  OWN=(j.events||[]).filter(e=>e&&e.t&&/^\d{4}-\d{2}-\d{2}$/.test(e.d||"")&&CC[e.c]&&e.c!="medday");render()
}).catch(()=>{});

/* Built-in health awareness days.
   month|day (or n:weekday = nth weekday, -1 = last)|length in days|title|level (B basic, A advanced) */
const MDS="1|-1:0|1|World Leprosy Day|A;2|4|1|World Cancer Day|B;2|2:1|1|International Epilepsy Day|A;3|3|1|World Hearing Day|A;3|2:4|1|World Kidney Day|A;3|16|1|National Vaccination Day (India)|B;3|21|1|World Down Syndrome Day|A;3|24|1|World TB Day|B;4|2|1|World Autism Awareness Day|A;4|7|1|World Health Day|B;4|10|1|World Homoeopathy Day|B;4|11|1|World Parkinson’s Day|A;4|11|1|National Safe Motherhood Day (India)|B;4|17|1|World Haemophilia Day|A;4|24|7|World Immunization Week|B;4|25|1|World Malaria Day|B;5|5|1|World Hand Hygiene Day|B;5|1:2|1|World Asthma Day|A;5|8|1|World Thalassaemia Day|A;5|12|1|International Nurses Day|B;5|17|1|World Hypertension Day|A;5|31|1|World No Tobacco Day|B;6|14|1|World Blood Donor Day|B;6|19|1|World Sickle Cell Day|A;7|1|1|National Doctors’ Day (India)|B;7|6|1|World Zoonoses Day|A;7|28|1|World Hepatitis Day|B;8|1|7|World Breastfeeding Week|B;9|8|1|World Physiotherapy Day|A;9|13|1|World Sepsis Day|A;9|17|1|World Patient Safety Day|B;9|21|1|World Alzheimer’s Day|A;9|25|1|World Pharmacists Day|A;9|28|1|World Rabies Day|A;9|29|1|World Heart Day|B;10|10|1|World Mental Health Day|B;10|2:4|1|World Sight Day|A;10|13|1|World Thrombosis Day|A;10|16|1|World Anaesthesia Day|A;10|16|1|World Spine Day|A;10|18|1|World Menopause Day|A;10|20|1|World Osteoporosis Day|A;10|24|1|World Polio Day|A;10|29|1|World Stroke Day|A;11|8|1|International Day of Radiology|A;11|12|1|World Pneumonia Day|A;11|14|1|World Diabetes Day|B;11|17|1|World Prematurity Day|A;11|18|7|World Antimicrobial Resistance Awareness Week|A;11|3:3|1|World COPD Day|A;12|1|1|World AIDS Day|B";
const MC={};
function mdays(y){
  if(MC[y])return MC[y];
  const o=[];
  MDS.split(";").forEach(r=>{
    const[m0,dd,len,t,lv]=r.split("|"),m=+m0;let day;
    if(dd.includes(":")){
      const[n,w]=dd.split(":").map(Number);
      if(n>0){const f=new Date(y,m-1,1);day=1+((w-f.getDay()+7)%7)+(n-1)*7}
      else{const l=new Date(y,m,0);day=l.getDate()-((l.getDay()-w+7)%7)}
    }else day=+dd;
    for(let k=0;k<+len;k++)o.push({t,d:ymd(new Date(y,m-1,day+k)),c:"medday",lv,
      n:(lv=="B"?"Basic: a public-health or foundation awareness day.":"Advanced: a clinical or specialty awareness day.")+(+len>1?" Observed over "+len+" days.":"")});
  });
  return MC[y]=o;
}

const now=new Date();
const st={m:new Date(now.getFullYear(),now.getMonth(),1),sel:ymd(now),off:new Set(),lv:"all"};

function evs(){
  const y=st.m.getFullYear(),map={};
  const put=e=>{
    if(st.off.has(e.c))return;
    if(e.c=="medday"&&st.lv!="all"&&e.lv!=st.lv)return;
    (map[e.d]=map[e.d]||[]).push(e);
  };
  [...mdays(y-1),...mdays(y),...mdays(y+1)].forEach(put);
  OWN.forEach(put);
  for(const k in map)map[k].sort((a,b)=>(a.tm||"").localeCompare(b.tm||""));
  return map;
}

function link(u){return /^https:\/\//.test(u||"")?`<a class="go" href="${esc(u)}" target="_blank" rel="noopener">Details and registration</a>`:""}

function render(){
  const map=evs(),M=st.m,t=ymd(new Date());
  const f=new Date(M.getFullYear(),M.getMonth(),1),s=add(f,-((f.getDay()+6)%7));
  $("#title").textContent=M.toLocaleDateString(undefined,{month:"long",year:"numeric"});

  $("#cats").innerHTML=CATS.map(c=>`<button class="chip" style="--c:${c[2]}" data-c="${c[0]}" aria-pressed="${!st.off.has(c[0])}"><i></i>${c[1]}</button>`).join("");
  $("#lvs").innerHTML=`<span class="lab">Awareness days</span>`+[["all","All"],["B","Basic"],["A","Advanced"]].map(x=>`<button class="chip" data-lv="${x[0]}" aria-pressed="${st.lv==x[0]}">${x[1]}</button>`).join("");

  $("#grid").innerHTML=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="wd">${x}</div>`).join("")+
    [...Array(42)].map((_,i)=>{
      const x=add(s,i),k=ymd(x),e=map[k]||[];
      const cats=[...new Set(e.map(z=>z.c))];
      const label=x.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+", "+(e.length?e.length+(e.length>1?" items":" item"):"nothing scheduled");
      return`<button class="cd${k==t?" t":""}${x.getMonth()!=M.getMonth()?" o":""}" data-d="${k}" aria-pressed="${k==st.sel}" aria-label="${esc(label)}"><span class="n">${x.getDate()}</span><span class="dots">${cats.map(c=>`<i style="--c:${CC[c][2]}"></i>`).join("")}</span></button>`;
    }).join("");

  const list=map[st.sel]||[];
  $("#day").innerHTML=`<h2>${long(pd(st.sel))}</h2>`+(list.length?list.map(e=>`<article class="ev" style="--c:${CC[e.c][2]}"><div class="meta"><span>${CC[e.c][1]}</span>${e.tm?`<span>${esc(e.tm)}</span>`:""}${e.m?`<span>${esc(e.m)}</span>`:""}</div><h3>${esc(e.t)}</h3>${e.n?`<p>${esc(e.n)}</p>`:""}${link(e.l)}</article>`).join(""):`<p class="mut">Nothing on this day.</p>`);
}

$("#prev").onclick=()=>{st.m=new Date(st.m.getFullYear(),st.m.getMonth()-1,1);render()};
$("#next").onclick=()=>{st.m=new Date(st.m.getFullYear(),st.m.getMonth()+1,1);render()};
$("#today").onclick=()=>{const n=new Date();st.m=new Date(n.getFullYear(),n.getMonth(),1);st.sel=ymd(n);render()};
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.d){st.sel=b.dataset.d;const d=pd(b.dataset.d);if(d.getMonth()!=st.m.getMonth())st.m=new Date(d.getFullYear(),d.getMonth(),1);render()}
  else if(b.dataset.c){st.off.has(b.dataset.c)?st.off.delete(b.dataset.c):st.off.add(b.dataset.c);render()}
  else if(b.dataset.lv){st.lv=b.dataset.lv;render()}
});
render();
</script>
</body>
</html>
