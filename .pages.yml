content:
  - name: events
    label: Calendar events
    type: file
    path: events.json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - { name: t, label: Title, type: string }
          - { name: d, label: "Date (YYYY-MM-DD)", type: string }
          - { name: tm, label: "Time (HH:MM, optional)", type: string }
          - { name: c, label: Category, type: select, options: { values: [webinar, event, contest, workshop] } }
          - { name: m, label: Mode, type: select, options: { values: [Online, Offline] } }
          - { name: n, label: Notes, type: text }
          - { name: l, label: "Registration link (must start with https://)", type: string }
